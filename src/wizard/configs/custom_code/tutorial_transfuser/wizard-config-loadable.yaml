      - /home/muut/Documents/research/nvidiaAuto/alpasim/plugins:/repo/plugins
      - //home/muut/Documents/research/nvidiaAuto/alpasim/src/wizard/configs/custom_code/tutorial_transfuser:/mnt/output
      - /home/muut/Documents/research/nvidiaAuto/alpasim/src:/repo/src
      - /home/muut/.cache/huggingface:/root/.cache/huggingface
    workdir: null
  physics:
    command:
      - uv run physics_server
      - --host=0.0.0.0
      - --port={port}
      - --artifact-glob=/mnt/nre-data/{sceneset}/**/*.usdz
      - --use-ground-mesh=true
      - --cache-size=16
      - --log-level=INFO
    environments:
      - WARP_CACHE_PATH='/mnt/warp'
    external_image: false
    gpus:
      - 0
    image: alpasim-base:0.1.4
    remap_root: false
    replicas_per_container: 1
    volumes:
      - /home/muut/Documents/research/nvidiaAuto/alpasim/data/nre-artifacts:/mnt/nre-data
      - /home/muut/Documents/research/nvidiaAuto/alpasim/src:/repo/src
      - /home/muut/Documents/research/nvidiaAuto/alpasim/plugins:/repo/plugins
    workdir: null
  runtime:
    command:
      - uv run python -m alpasim_runtime.simulate
      - --usdz-glob=/mnt/nre-data/{sceneset}/**/*.usdz
      - --user-config=/mnt/log_dir/{runtime_config_name}
      - --network-config=/mnt/log_dir/generated-network-config.yaml
      - --log-dir=/mnt/log_dir
      - --log-level=INFO
      - --array-job-dir=/mnt/array_job_dir
      - --eval-config=/mnt/log_dir/eval-config.yaml
    depends_on:
      - driver
      - sensorsim
      - physics
      - trafficsim
      - controller
    environments: []
    external_image: false
    gpus: null
    image: alpasim-base:0.1.4
    remap_root: false
    replicas_per_container: 1
    volumes:
      - /home/muut/Documents/research/nvidiaAuto/alpasim/data/nre-artifacts:/mnt/nre-data
      - //home/muut/Documents/research/nvidiaAuto/alpasim/src/wizard/configs/custom_code/tutorial_transfuser:/mnt/log_dir
      - //home/muut/Documents/research/nvidiaAuto/alpasim/src/wizard/configs/custom_code/tutorial_transfuser:/mnt/array_job_dir
      - /home/muut/Documents/research/nvidiaAuto/alpasim/src:/repo/src
      - /home/muut/Documents/research/nvidiaAuto/alpasim/plugins:/repo/plugins
    workdir: null
  sensorsim:
    command:
      - /app/pycena_run.runfiles/nre_repo/scripts/pycena/runtime/entrypoint_3_11.sh
      - --port={port}
      - --host=0.0.0.0
      - --artifact-glob=/mnt/nre-data/{sceneset}/**/*.usdz
      - --egocar-hood-dir=/mnt/ego-hoods
      - --no-enable-nrend
      - --download-cache-dir /tmp/nre-cache-dir
      - --cache-size=4
    environments:
      - OMP_NUM_THREADS=1
    external_image: true
    gpus:
      - 0
    image: docker.io/carlasimulator/nvidia-nurec-grpc:0.2.0
    remap_root: false
    replicas_per_container: 1
    volumes:
      - /home/muut/Documents/research/nvidiaAuto/alpasim/data/nre-artifacts:/mnt/nre-data
      - /home/muut/Documents/research/nvidiaAuto/alpasim/data/nre-artifacts/ego-hoods:/mnt/ego-hoods
    workdir: null
  trafficsim:
