services:
  controller:
    command:
      - uv run python -m alpasim_controller.server
      - --port={port}
      - --log_dir=/mnt/output
      - --log-level=INFO
    environments: []
    external_image: false
    gpus: null
    image: alpasim-base:0.1.4
    remap_root: false
    replicas_per_container: 1
    volumes:
      - //home/muut/Documents/research/nvidiaAuto/alpasim/src/wizard/configs/custom_code/tutorial_transfuser/controller:/mnt/output
      - /home/muut/Documents/research/nvidiaAuto/alpasim/src:/repo/src
      - /home/muut/Documents/research/nvidiaAuto/alpasim/plugins:/repo/plugins
    workdir: null
  driver:
    command:
      - uv run -m alpasim_driver.main
      - --config-path=/mnt/output
      - --config-name=driver-config.yaml
      - host=0.0.0.0
